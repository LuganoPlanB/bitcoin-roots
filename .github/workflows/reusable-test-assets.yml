name: Prepare shared test inputs
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      fuzz:
        required: false
        default: false
        type: boolean
      unit:
        required: false
        default: true
        type: boolean
    outputs:
      revision:
        value: ${{ jobs.prepare.outputs.revision }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Acquire fresh qa-assets once
        uses: actions/checkout@v6
        with:
          repository: bitcoin-core/qa-assets
          path: qa-assets-inputs
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.unit && 'unit_test_data' || '' }}
            ${{ inputs.fuzz && 'fuzz_corpora' || '' }}
      - name: Prepare shared inputs
        id: prepare
        env:
          INCLUDE_FUZZ: ${{ inputs.fuzz }}
          INCLUDE_UNIT: ${{ inputs.unit }}
        run: |
          set -Eeuo pipefail
          echo "revision=$(git -C qa-assets-inputs rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          kinds=()
          if [[ "$INCLUDE_UNIT" == true ]]; then kinds+=(unit_test_data); fi
          if [[ "$INCLUDE_FUZZ" == true ]]; then kinds+=(fuzz_corpora); fi
          for kind in "${kinds[@]}"; do
            python3 test/download_utils.py prepare qa-assets-inputs "$kind"
            tar -cf "$RUNNER_TEMP/$kind.tar" -C qa-assets-inputs "$kind"
          done
      - name: Share unit inputs
        if: inputs.unit
        uses: actions/upload-artifact@v4
        with:
          name: qa-assets-unit_test_data
          path: ${{ runner.temp }}/unit_test_data.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 3
      - name: Share fuzz inputs
        if: inputs.fuzz
        uses: actions/upload-artifact@v4
        with:
          name: qa-assets-fuzz_corpora
          path: ${{ runner.temp }}/fuzz_corpora.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 3
