name: Trusted Roots replay
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      run: {description: Run accepted locks even when unchanged, required: true, default: auto, type: choice, options: [auto, force]}
      operation: {description: Explicit trusted operation, required: true, default: replay, type: choice, options: [replay, promote]}
      candidate_commit: {description: Frozen integration commit for explicit promotion validation, required: false, default: '', type: string}
      candidate_tree: {description: Frozen integration tree for explicit promotion validation, required: false, default: '', type: string}
      control_sha: {description: Accepted control commit that must equal this event SHA, required: false, default: '', type: string}
permissions: {contents: read}
concurrency: {group: 'roots-trusted-replay-${{ github.workflow }}', cancel-in-progress: true}
env:
  CORE_29_3_COMMIT: 99003bed87333f1be51bf3070235591b3a72f007
  CORE_29_3_TREE: d7910bd5e9335128932f1f848a767d773895c4a4
  CORE_29_4_COMMIT: 3fc0865963a38b871e9f7d94e6151c4953563516
  CORE_29_4_TREE: 38ad59b187f59647eb90ad1347bc481485ef4d01
  KNOTS_29_3_COMMIT: 99ee26e9df0e63a5d1e0ab6bd46b1862ce67648b
  KNOTS_29_3_TREE: 56f97d3a9199c1fb191e1b8a21f2caae3901b7f6
  LOCKED_INPUT_DIGEST: 7579c043e50213b2b70c59a6a5977bb315a48fa2efd1c1a1d316b4dab9a3c401
jobs:
  promotion-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate_commit: '${{ steps.inputs.outputs.candidate_commit }}'
      candidate_tree: '${{ steps.inputs.outputs.candidate_tree }}'
      control_sha: '${{ steps.inputs.outputs.control_sha }}'
    steps:
      - id: inputs
        env:
          CANDIDATE_COMMIT: '${{ inputs.candidate_commit }}'
          CANDIDATE_TREE: '${{ inputs.candidate_tree }}'
          CONTROL_SHA: '${{ inputs.control_sha }}'
          EVENT_SHA: '${{ github.sha }}'
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONTROL_SHA" = "$EVENT_SHA"
          printf 'candidate_commit=%s\n' "$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'candidate_tree=%s\n' "$CANDIDATE_TREE" >> "$GITHUB_OUTPUT"
          printf 'control_sha=%s\n' "$CONTROL_SHA" >> "$GITHUB_OUTPUT"
  gate:
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs: {decision: '${{ steps.gate.outputs.decision }}'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}
      - id: gate
        env:
          EVENT: '${{ github.event_name }}'
          RUN: "${{ inputs.run || 'auto' }}"
        run: |
          set -Eeuo pipefail
          mode=manual; [[ "$EVENT" == schedule ]] && mode=schedule
          digest="$(sha256sum contrib/roots/adaptation-manifest-29.3.json contrib/roots/methodology-v1.json contrib/roots/core-29.4-migration-fixture.json | sha256sum | awk '{print $1}')"
          changed=false; [[ "$digest" != "$LOCKED_INPUT_DIGEST" ]] && changed=true
          mkdir "$RUNNER_TEMP/replay-gate"
          decision="$(python3 ci/roots-trusted-replay-gate.py --mode "$mode" --changed "$changed" --manual-run "$RUN" --later-base none --manifest contrib/roots/adaptation-manifest-29.3.json --methodology contrib/roots/methodology-v1.json --fixture contrib/roots/core-29.4-migration-fixture.json --output "$RUNNER_TEMP/replay-gate/trusted-replay-report.json")"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
  fetch:
    needs: gate
    if: needs.gate.outputs.decision == 'replay'
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}
      - run: |
          set -Eeuo pipefail
          git init "$RUNNER_TEMP/core-source"
          git -C "$RUNNER_TEMP/core-source" fetch --no-tags https://github.com/bitcoin/bitcoin.git "$CORE_29_3_COMMIT" "$CORE_29_4_COMMIT"
          git -C "$RUNNER_TEMP/core-source" fetch --no-tags https://github.com/bitcoinknots/bitcoin.git "$KNOTS_29_3_COMMIT"
          test "$(git -C "$RUNNER_TEMP/core-source" rev-parse "$CORE_29_3_COMMIT^{tree}")" = "$CORE_29_3_TREE"
          test "$(git -C "$RUNNER_TEMP/core-source" rev-parse "$CORE_29_4_COMMIT^{tree}")" = "$CORE_29_4_TREE"
          test "$(git -C "$RUNNER_TEMP/core-source" rev-parse "$KNOTS_29_3_COMMIT^{tree}")" = "$KNOTS_29_3_TREE"
  replay:
    needs: [gate, fetch]
    if: needs.gate.outputs.decision == 'replay'
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}
      - run: |
          set -Eeuo pipefail
          reconstruct() {
            local name="$1" revision="$2" tree="$3" manifest="$4" materials="$5" root="$6" work="$RUNNER_TEMP/$1-$7"
            git clone --no-checkout . "$work"
            remote=https://github.com/bitcoin/bitcoin.git
            [[ "$name" == roots-29.3 ]] && remote=https://github.com/bitcoinknots/bitcoin.git
            git -C "$work" remote add immutable "$remote"
            git -C "$work" fetch --no-tags immutable "$revision"
            git -C "$work" checkout --detach "$revision"
            python3 contrib/devtools/roots-replay.py replay --repository "$work" --revision "$revision" --expected-tree "$tree" --manifest "$GITHUB_WORKSPACE/$manifest" --materials "$GITHUB_WORKSPACE/$materials" --materials-root "$GITHUB_WORKSPACE/$root" --state-directory "$RUNNER_TEMP/$name-$7-state" --apply
            state="$(find "$RUNNER_TEMP/$name-$7-state" -name 'replay-state*.json' -type f | sort | tail -n 1)"
            python3 contrib/devtools/roots-replay.py report --state "$state" --output-directory "$RUNNER_TEMP/$name-$7-report"
            python3 contrib/devtools/roots-replay.py export-patches --repository "$work" --state "$state" --output "$RUNNER_TEMP/$name-$7-report/replay-generated-series.patch"
            cp "$state" "$RUNNER_TEMP/$name-$7-report/replay-state.json"
          }
          reconstruct calibration "$CORE_29_3_COMMIT" "$CORE_29_3_TREE" contrib/roots/replay-core-to-knots-29.3/adaptation-manifest-29.3.json contrib/roots/replay-core-to-knots-29.3/replay-materials.json contrib/roots/replay-core-to-knots-29.3 a
          reconstruct calibration "$CORE_29_3_COMMIT" "$CORE_29_3_TREE" contrib/roots/replay-core-to-knots-29.3/adaptation-manifest-29.3.json contrib/roots/replay-core-to-knots-29.3/replay-materials.json contrib/roots/replay-core-to-knots-29.3 b
          reconstruct roots-29.3 "$KNOTS_29_3_COMMIT" "$KNOTS_29_3_TREE" contrib/roots/replay-29.3-release/adaptation-manifest-29.3.json contrib/roots/replay-29.3-release/replay-materials.json contrib/roots/replay-29.3-release a
          reconstruct roots-29.3 "$KNOTS_29_3_COMMIT" "$KNOTS_29_3_TREE" contrib/roots/replay-29.3-release/adaptation-manifest-29.3.json contrib/roots/replay-29.3-release/replay-materials.json contrib/roots/replay-29.3-release b
          reconstruct locked-29.4 "$CORE_29_4_COMMIT" "$CORE_29_4_TREE" contrib/roots/replay-29.4-proposal/adaptation-manifest-29.3.json contrib/roots/replay-29.4-proposal/replay-materials.json contrib/roots/replay-29.4-proposal a
          reconstruct locked-29.4 "$CORE_29_4_COMMIT" "$CORE_29_4_TREE" contrib/roots/replay-29.4-proposal/adaptation-manifest-29.3.json contrib/roots/replay-29.4-proposal/replay-materials.json contrib/roots/replay-29.4-proposal b
          mkdir "$RUNNER_TEMP/replay-artifacts"
          for pair in "core-to-knots-29.3:calibration" "roots-29.3:roots-29.3" "core-29.4:locked-29.4"; do role="${pair%%:*}"; source="${pair##*:}"; for run in a b; do mkdir -p "$RUNNER_TEMP/replay-artifacts/$role/$run"; cp "$RUNNER_TEMP/$source-$run-report/replay-state.json" "$RUNNER_TEMP/$source-$run-report/replay-review.json" "$RUNNER_TEMP/$source-$run-report/replay-review.txt" "$RUNNER_TEMP/$source-$run-report/replay-generated-series.patch" "$RUNNER_TEMP/replay-artifacts/$role/$run/"; done; done
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with: {name: 'roots-replay-evidence-${{ github.sha }}', path: '${{ runner.temp }}/replay-artifacts/', if-no-files-found: error, retention-days: 7}
  review:
    needs: replay
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: {name: 'roots-replay-evidence-${{ github.sha }}', path: '${{ runner.temp }}/replay-artifacts'}
      - run: |
          set -Eeuo pipefail
          test "$(find "$RUNNER_TEMP/replay-artifacts" -type f | wc -l)" = 24
          test "$(find "$RUNNER_TEMP/replay-artifacts" -type l | wc -l)" = 0
          test "$(find "$RUNNER_TEMP/replay-artifacts" -type f -size +10000000c | wc -l)" = 0
          python3 ci/roots-trusted-replay-review.py --methodology contrib/roots/methodology-v1.json --artifacts "$RUNNER_TEMP/replay-artifacts"
  build-test:
    needs: review
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}
      - name: Install supported headless build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkgconf python3 libevent-dev libboost-dev libsqlite3-dev ccache
      - name: Reconstruct, build, and test every exact candidate
        shell: bash
        env:
          REPLAY: ${{ github.workspace }}/contrib/devtools/roots-replay.py
          ACCEPT: ${{ github.workspace }}/ci/roots-trusted-candidate-build.py
        run: |
          set -Eeuo pipefail
          reconstruct_and_test() {
            local name="$1" revision="$2" tree="$3" manifest="$4" materials="$5" root="$6" target_tree="$7"
            local work="$RUNNER_TEMP/accept-$name" state="$RUNNER_TEMP/accept-$name-state" build="$RUNNER_TEMP/accept-$name-build"
            git clone --no-checkout . "$work"
            remote=https://github.com/bitcoin/bitcoin.git
            [[ "$name" == roots-29.3 ]] && remote=https://github.com/bitcoinknots/bitcoin.git
            git -C "$work" remote add immutable "$remote"
            git -C "$work" fetch --no-tags immutable "$revision"
            git -C "$work" checkout --detach "$revision"
            mkdir "$state"
            python3 "$REPLAY" replay --repository "$work" --revision "$revision" --expected-tree "$tree" --manifest "$GITHUB_WORKSPACE/$manifest" --materials "$GITHUB_WORKSPACE/$materials" --materials-root "$GITHUB_WORKSPACE/$root" --state-directory "$state" --apply
            python3 "$ACCEPT" --repository "$state/owned-candidate" --expected-tree "$target_tree" --build-directory "$build" --jobs 2
          }
          reconstruct_and_test core-to-knots-29.3 "$CORE_29_3_COMMIT" "$CORE_29_3_TREE" contrib/roots/replay-core-to-knots-29.3/adaptation-manifest-29.3.json contrib/roots/replay-core-to-knots-29.3/replay-materials.json contrib/roots/replay-core-to-knots-29.3 56f97d3a9199c1fb191e1b8a21f2caae3901b7f6
          reconstruct_and_test roots-29.3 "$KNOTS_29_3_COMMIT" "$KNOTS_29_3_TREE" contrib/roots/replay-29.3-release/adaptation-manifest-29.3.json contrib/roots/replay-29.3-release/replay-materials.json contrib/roots/replay-29.3-release a5708dcbf1d2611360fab68fc6a8e504db1ba95d
          reconstruct_and_test core-29.4 "$CORE_29_4_COMMIT" "$CORE_29_4_TREE" contrib/roots/replay-29.4-proposal/adaptation-manifest-29.3.json contrib/roots/replay-29.4-proposal/replay-materials.json contrib/roots/replay-29.4-proposal 39a5e30207a09962e78ae81c24cc65b1e478ef90
      - run: |
          set -Eeuo pipefail
          python3 ci/test/test_roots_replay.py
  promotion:
    needs: promotion-inputs
    permissions: {contents: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}
      - name: Fetch the hardcoded integration candidate as data
        env:
          CANDIDATE_COMMIT: '${{ needs.promotion-inputs.outputs.candidate_commit }}'
          CANDIDATE_TREE: '${{ needs.promotion-inputs.outputs.candidate_tree }}'
          CONTROL_SHA: '${{ needs.promotion-inputs.outputs.control_sha }}'
          EVENT_SHA: '${{ github.sha }}'
        run: |
          set -Eeuo pipefail
          test "$CONTROL_SHA" = "$EVENT_SHA"
          test "$CANDIDATE_COMMIT" = dfc74d403585f7c23815ef80d2e206b85c33919a
          test "$CANDIDATE_TREE" = 477eb9b3f50098b0b8548a9ff35efaa29fd7ecde
          mkdir "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" init
          git -C "$RUNNER_TEMP/candidate" config credential.helper ''
          git -C "$RUNNER_TEMP/candidate" remote add origin "https://github.com/${{ github.repository }}.git"
          before="$(GIT_TERMINAL_PROMPT=0 git -C "$RUNNER_TEMP/candidate" -c credential.helper= ls-remote --refs origin refs/heads/integration/roots-29.4 | awk '{print $1}')"
          test "$before" = "$CANDIDATE_COMMIT"
          GIT_TERMINAL_PROMPT=0 git -C "$RUNNER_TEMP/candidate" -c credential.helper= -c core.askPass= fetch --no-tags origin "$CANDIDATE_COMMIT" "+refs/heads/integration/roots-29.4:refs/remotes/origin/integration/roots-29.4"
          git -C "$RUNNER_TEMP/candidate" checkout --detach "$CANDIDATE_COMMIT"
          after="$(GIT_TERMINAL_PROMPT=0 git -C "$RUNNER_TEMP/candidate" -c credential.helper= ls-remote --refs origin refs/heads/integration/roots-29.4 | awk '{print $1}')"
          test "$after" = "$before"
      - name: Validate and build the immutable candidate once
        env:
          CANDIDATE_COMMIT: '${{ needs.promotion-inputs.outputs.candidate_commit }}'
          CANDIDATE_TREE: '${{ needs.promotion-inputs.outputs.candidate_tree }}'
          CONTROL_SHA: '${{ needs.promotion-inputs.outputs.control_sha }}'
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/promotion-evidence"
          mkdir "$evidence"
          python3 ci/roots-trusted-promotion.py --candidate-commit "$CANDIDATE_COMMIT" --candidate-tree "$CANDIDATE_TREE" --control-sha "$CONTROL_SHA" --candidate-repository "$RUNNER_TEMP/candidate" --trusted-root "$GITHUB_WORKSPACE" --output "$evidence/trusted-promotion-report.json"
          python3 ci/roots-trusted-candidate-build.py --repository "$RUNNER_TEMP/candidate" --expected-tree "$CANDIDATE_TREE" --build-directory "$RUNNER_TEMP/candidate-build" --jobs 2
          ccache -s > "$evidence/ccache-stats.txt"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with: {name: 'roots-promotion-evidence-${{ github.sha }}', path: '${{ runner.temp }}/promotion-evidence/', if-no-files-found: error, retention-days: 7}
