name: Release artifacts

on:
  push:
    tags:
      - 'v[0-9]*-roots.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release-metadata-tests:
    name: Release metadata tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag source
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          ci/release/validate-release-source.sh "$RELEASE_TAG"

      - name: Run release metadata tests
        run: |
          set -Eeuo pipefail
          python3 ci/test/test_prepare_release.py
          python3 ci/test/test_validate_release_tag.py
          python3 ci/test/test_validate_release_source.py
          python3 ci/test/test_release_version.py

  linux-release:
    name: Linux x86_64 release package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: release-metadata-tests
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag source
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          ci/release/validate-release-source.sh "$RELEASE_TAG"

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential cmake pkgconf python3 libboost-dev libevent-dev libsqlite3-dev

      - name: Build and package
        run: |
          set -Eeuo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_TX=OFF -DBUILD_UTIL=OFF \
            -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DENABLE_WALLET=OFF
          cmake --build build -j 2
          archive_root="$(python3 ci/release/archive.py root-name)"
          package_parent="${RUNNER_TEMP}/release-package"
          package_dir="${RUNNER_TEMP}/release-assets"
          archive="${package_dir}/bitcoin-roots-linux-x86_64.tar.gz"
          cmake --install build --prefix "${package_parent}/${archive_root}"
          mkdir -p "$package_dir"
          tar -C "$package_parent" -czf "$archive" "$archive_root"
          python3 ci/release/archive.py validate "$archive" "$archive_root"
          (
            cd "$package_dir"
            sha256sum "${archive##*/}" > SHA256SUMS
          )

      - name: Upload unsigned release package
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-roots-linux-x86_64
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Create signed draft release
    needs: linux-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      EXPECTED_FINGERPRINT: 5EADD53F2CD1F0B7AEEE920D25FC5C29CD528E32
      PUBLIC_KEY_FILE: contrib/release/bitcoin-roots-release-key.asc
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag source
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          ci/release/validate-release-source.sh "$RELEASE_TAG"

      - name: Download release package
        uses: actions/download-artifact@v5
        with:
          name: bitcoin-roots-linux-x86_64
          path: downloaded-artifacts

      - name: Prepare release assets
        run: |
          set -Eeuo pipefail
          ci/release/prepare-release.sh \
            downloaded-artifacts release-assets "$PUBLIC_KEY_FILE" "$RELEASE_TAG" 1

      - name: Sign and verify manifest
        env:
          BITCOIN_ROOTS_GPG_SK: ${{ secrets.BITCOIN_ROOTS_GPG_SK }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${BITCOIN_ROOTS_GPG_SK:-}" ]]; then
            printf 'BITCOIN_ROOTS_GPG_SK is not configured\n' >&2
            exit 1
          fi
          gpg_home="${RUNNER_TEMP}/bitcoin-roots-release-gpg"
          install -d -m 0700 "$gpg_home"
          trap 'rm -rf -- "$gpg_home"' EXIT
          export GNUPGHOME="$gpg_home"
          public_fingerprint="$(
            gpg --batch --with-colons --import-options show-only --import "$PUBLIC_KEY_FILE" |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [[ "$public_fingerprint" != "$EXPECTED_FINGERPRINT" ]]; then
            printf 'Unexpected release public-key fingerprint\n' >&2
            exit 1
          fi
          printf '%s\n' "$BITCOIN_ROOTS_GPG_SK" | gpg --batch --import
          secret_fingerprint="$(
            gpg --batch --with-colons --list-secret-keys "$EXPECTED_FINGERPRINT" |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [[ "$secret_fingerprint" != "$EXPECTED_FINGERPRINT" ]]; then
            printf 'The configured secret key does not match the release public key\n' >&2
            exit 1
          fi
          gpg --batch --yes --armor --local-user "$EXPECTED_FINGERPRINT" \
            --output release-assets/SHA512SUMS.asc --detach-sign release-assets/SHA512SUMS
          gpg --batch --verify release-assets/SHA512SUMS.asc release-assets/SHA512SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG" --draft --generate-notes \
            --title "Bitcoin Roots $RELEASE_TAG" --verify-tag release-assets/*
