name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Bitcoin Roots
        uses: actions/checkout@v6
        with:
          path: bitcoin-roots
          fetch-depth: 0

      - name: Check out the Plan B Vite theme
        uses: actions/checkout@v6
        with:
          repository: LuganoPlanB/vite-theme
          ref: b969923b3407fb85a46cf45a8e18385d239cf79e
          path: vite-theme

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bitcoin-roots/doc/website/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: bitcoin-roots/doc/website

      - name: Test website
        run: npm test
        working-directory: bitcoin-roots/doc/website

      - name: Build website
        run: npm run build
        working-directory: bitcoin-roots/doc/website
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: bitcoin-roots/doc/website/.vitepress/dist

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
