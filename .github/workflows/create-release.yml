name: Create release
run-name: Create release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Locked release tag: v29.4-roots.1'
        required: true
        type: string
      production_ref:
        description: 'Exact production branch name (roots/29.4)'
        required: true
        default: 'roots/29.4'
        type: string
      expected_commit:
        description: 'Full authorized production commit ID'
        required: true
        type: string
      confirm_release:
        description: 'Confirm creation of a permanent tag from the authorized production source'
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release-tag:
    name: 'Create tag and start release build'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONFIRM_RELEASE: ${{ inputs.confirm_release }}
      RELEASE_TAG: ${{ inputs.tag }}
      PRODUCTION_REF: ${{ inputs.production_ref }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Require exact production branch and explicit confirmation
        run: |
          set -Eeuo pipefail
          if [[ "$PRODUCTION_REF" != 'roots/29.4' || ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Create release requires roots/29.4 and a full expected commit\n' >&2
            exit 1
          fi
          if [[ "$CONFIRM_RELEASE" != 'true' ]]; then
            printf 'The release confirmation checkbox must be selected\n' >&2
            exit 1
          fi

      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/heads/${{ inputs.production_ref }}

      - name: Validate release tag
        run: ci/release/validate-release-tag.sh "$RELEASE_TAG"

      - name: Validate authorized production source
        run: ci/release/validate-promotion-source.py --contract contrib/roots/promotion-29.4.json --repository . --expected-commit "$EXPECTED_COMMIT" --tag "$RELEASE_TAG"

      - name: Verify exact production source and existing tag state
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "refs/heads/$PRODUCTION_REF:refs/remotes/origin/$PRODUCTION_REF"
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" || "$(git rev-parse HEAD)" != "$(git rev-parse "refs/remotes/origin/$PRODUCTION_REF")" ]]; then
            printf 'Checked-out production source is not the exact current origin production HEAD\n' >&2
            exit 1
          fi

          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
          if git rev-parse --verify "refs/tags/$RELEASE_TAG^{tag}" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$EXPECTED_COMMIT" ]]; then
              printf 'Existing release tag differs from the authorized production commit\n' >&2
              exit 1
            fi
          elif git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Existing release tag is lightweight, not annotated\n' >&2
            exit 1
          fi

      - name: Create annotated release tag
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG^{tag}" >/dev/null 2>&1; then
            git tag --annotate "$RELEASE_TAG" --message "Bitcoin Roots $RELEASE_TAG" HEAD
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Start tagged release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          current="$(gh run list --workflow release.yml --branch "$RELEASE_TAG" --json status,conclusion --limit 1 --jq '.[0].status + ":" + (.[0].conclusion // "")')"
          if [[ "$current" == in_progress:* || "$current" == queued:* || "$current" == completed:success ]]; then
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          printf 'Release workflow dispatched for %s\n' "$RELEASE_TAG"
