name: PR Tests
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      gui: ${{ steps.classify.outputs.gui }}
      wallet: ${{ steps.classify.outputs.wallet }}
      sanitizers: ${{ steps.classify.outputs.sanitizers }}
      fuzz: ${{ steps.classify.outputs.fuzz }}
      compat: ${{ steps.classify.outputs.compat }}
      platforms: ${{ steps.classify.outputs.platforms }}
      nightly_sanitizers: ${{ steps.classify.outputs.nightly_sanitizers }}
      nightly_fuzz: ${{ steps.classify.outputs.nightly_fuzz }}
      nightly_platforms: ${{ steps.classify.outputs.nightly_platforms }}
      nightly_full: ${{ steps.classify.outputs.nightly_full }}
    steps:
      # This read-only workflow does not expose secrets to PR code.
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run classifier regression tests
        run: |
          python3 ci/test/test_change_classifier.py
          python3 ci/test/test_windows_gui_workflows.py
      - name: Retrieve changed files
        id: files
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const files = new Set();
            let recordCount = 0;
            const maxFiles = 3000;
            let error = false;
            try {
              for (let page = 1; page <= 30; page++) {
                const response = await github.rest.pulls.listFiles({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                  page,
                });
                recordCount += response.data.length;
                for (const file of response.data) {
                  files.add(file.filename);
                  if (file.status === 'renamed' && typeof file.previous_filename === 'string') {
                    files.add(file.previous_filename);
                  }
                }
                if (response.data.length < 100) break;
                if (page === 30) error = true;
              }
              const expectedCount = context.payload.pull_request.changed_files;
              if (!Number.isInteger(expectedCount) || expectedCount >= maxFiles ||
                  expectedCount !== recordCount) error = true;
            } catch (exception) {
              core.warning(`Unable to retrieve a complete changed-file list: ${exception.message}`);
              error = true;
            }
            fs.writeFileSync('changed-files.json', JSON.stringify([...files]));
            core.setOutput('error', error ? 'true' : 'false');
      - name: Select CI groups
        id: classify
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          FILES_ERROR: ${{ steps.files.outputs.error }}
        run: |
          set -Eeuo pipefail
          args=()
          if [[ "${FILES_ERROR}" == "true" ]]; then
            args+=(--error --truncated)
          fi
          python3 ci/change-classifier.py \
            --files-json "$(<changed-files.json)" \
            --labels-json "${LABELS_JSON}" \
            --github-output "$GITHUB_OUTPUT" \
            "${args[@]}"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONTAINER_NAME: bitcoin-linter
    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Docker
        uses: ./.github/actions/configure-docker
      - name: Run lint
        run: |
          set -Eeuo pipefail
          cache_args=()
          if [[ -n "${DOCKER_BUILD_CACHE_ARG:-}" ]]; then
            read -r -a cache_args <<< "${DOCKER_BUILD_CACHE_ARG}"
          fi
          docker buildx build -t "$CONTAINER_NAME" "${cache_args[@]}" --file ./ci/lint_imagefile .
          docker run --rm -e CI_PULL_REQUEST=1 -e "CI_REPOSITORY=${{ github.repository }}" -v "$(pwd)":/bitcoin "$CONTAINER_NAME"

  gui:
    name: GUI and resources
    needs: classify
    if: needs.classify.outputs.gui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DANGER_CI_ON_HOST_FOLDERS: 1
      FILE_ENV: ./ci/test/00_setup_env_native_gui.sh
    steps:
      - &checkout-pr
        name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Configure environment
        uses: ./.github/actions/configure-environment
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          install: binary
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}
          max-size: 500M
          append-timestamp: true
          save: false
      - name: Restore caches
        uses: ./.github/actions/restore-caches
      - name: Configure Docker
        uses: ./.github/actions/configure-docker
      - name: Build and test GUI resources
        run: ./ci/test_run_all.sh

  sanitizers:
    name: ASan, LSan, UBSan, integer, wallet, GUI, and USDT
    needs: classify
    if: needs.classify.outputs.sanitizers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DANGER_CI_ON_HOST_FOLDERS: 1
      FILE_ENV: ./ci/test/00_setup_env_native_asan.sh
    steps:
      - *checkout-pr
      - name: Configure environment
        uses: ./.github/actions/configure-environment
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          install: binary
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}
          max-size: 500M
          append-timestamp: true
          save: false
      - name: Restore caches
        uses: ./.github/actions/restore-caches
      - name: Configure Docker
        uses: ./.github/actions/configure-docker
      - name: Enable USDT coverage
        run: sed -i "s|\${INSTALL_BCC_TRACING_TOOLS}|true|g" ./ci/test/00_setup_env_native_asan.sh
      - name: Run sanitizer coverage
        run: ./ci/test_run_all.sh

  fuzz:
    name: native Linux libFuzzer corpus
    needs: classify
    if: needs.classify.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DANGER_CI_ON_HOST_FOLDERS: 1
      FILE_ENV: ./ci/test/00_setup_env_native_fuzz.sh
    steps:
      - *checkout-pr
      - name: Configure environment
        uses: ./.github/actions/configure-environment
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          install: binary
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}
          max-size: 500M
          append-timestamp: true
          save: false
      - name: Restore caches
        uses: ./.github/actions/restore-caches
      - name: Configure Docker
        uses: ./.github/actions/configure-docker
      - name: Run native fuzz corpus
        run: ./ci/test_run_all.sh

  compat:
    name: previous releases compatibility
    needs: classify
    if: needs.classify.outputs.compat == 'true' && needs.classify.outputs.nightly_full != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DANGER_CI_ON_HOST_FOLDERS: 1
      FILE_ENV: ./ci/test/00_setup_env_native_previous_releases.sh
    steps:
      - *checkout-pr
      - name: Configure environment
        uses: ./.github/actions/configure-environment
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          install: binary
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}
          max-size: 500M
          append-timestamp: true
          save: false
      - name: Restore caches
        uses: ./.github/actions/restore-caches
      - name: Configure Docker
        uses: ./.github/actions/configure-docker
      - name: Run compatibility coverage
        run: ./ci/test_run_all.sh

  arm32:
    name: 32-bit ARM unit tests
    needs: classify
    if: needs.classify.outputs.platforms == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      DANGER_CI_ON_HOST_FOLDERS: 1
      FILE_ENV: ./ci/test/00_setup_env_arm.sh
    steps:
      - *checkout-pr
      - name: Configure environment
        uses: ./.github/actions/configure-environment
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          install: binary
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
            ${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}
          max-size: 500M
          append-timestamp: true
          save: false
      - name: Restore caches
        uses: ./.github/actions/restore-caches
      - name: Configure Docker
        uses: ./.github/actions/configure-docker
      - name: Run ARM32 unit tests
        run: ./ci/test_run_all.sh

  windows-smoke:
    name: Windows x86_64 production-like smoke
    needs: classify
    if: needs.classify.outputs.platforms == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - *checkout-pr
      - name: Set up VS Developer Prompt
        shell: pwsh -Command "$PSVersionTable; $PSNativeCommandUseErrorActionPreference = $true; $ErrorActionPreference = 'Stop'; & '{0}'"
        run: |
          $vswherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswherePath -latest -property installationPath
          & "${env:COMSPEC}" /s /c "`"$installationPath\Common7\Tools\vsdevcmd.bat`" -arch=x64 -no_logo && set" | foreach-object {
            $name, $value = $_ -split '=', 2
            echo "$name=$value" >> $env:GITHUB_ENV
          }
      - name: Record tool versions
        shell: pwsh
        run: |
          cmake -version | Tee-Object -FilePath cmake_version
          msbuild -version | Tee-Object -FilePath msbuild_version
          $env:VCToolsVersion | Tee-Object -FilePath toolset_version
      - name: Configure vcpkg
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "set(VCPKG_BUILD_TYPE release)" >> "${VCPKG_INSTALLATION_ROOT}/triplets/x64-windows.cmake"
          echo "set(VCPKG_BUILD_TYPE release)" >> "${VCPKG_INSTALLATION_ROOT}/triplets/x64-windows-static.cmake"
          sed -i '1s/^/set(ENV{CMAKE_POLICY_VERSION_MINIMUM} 3.5)\n/' "${VCPKG_INSTALLATION_ROOT}/scripts/ports.cmake"
      - name: Restore vcpkg tools cache
        uses: actions/cache/restore@v5
        with:
          path: C:/vcpkg/downloads/tools
          key: ${{ github.job }}-vcpkg-tools
      - name: Restore vcpkg binary cache
        id: vcpkg-binary-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ github.job }}-vcpkg-binary-${{ hashFiles('cmake_version', 'msbuild_version', 'toolset_version', 'vcpkg.json') }}
      - name: Configure, build, and smoke test
        shell: pwsh
        run: |
          cmake -B build --preset vs2022-static -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DBUILD_GUI=ON -DWITH_BDB=ON -DWITH_MINIUPNPC=ON -DWITH_ZMQ=ON -DBUILD_TESTS=ON -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_WALLET_TOOL=ON -DWERROR=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
  macos-smoke:
    name: macOS ${{ matrix.expected-arch }} native production-like smoke
    needs: classify
    if: needs.classify.outputs.platforms == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            expected-arch: x86_64
          - runner: macos-15
            expected-arch: arm64
    steps:
      - *checkout-pr
      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.expected-arch }}
        run: |
          set -Eeuo pipefail
          actual_arch="$(uname -m)"
          if [[ "${actual_arch}" != "${EXPECTED_ARCH}" ]]; then
            echo "Expected ${EXPECTED_ARCH}, but runner reported ${actual_arch}" >&2
            exit 1
          fi
      - name: Install build dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          set -Eeuo pipefail
          brew install --quiet python@3 || brew link --overwrite python@3
          brew install --quiet coreutils ninja pkgconf gnu-getopt ccache boost libevent miniupnpc zeromq qt@5 qrencode imagemagick libicns librsvg
      - name: Set compiler cache directory
        run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache_dir" >> "$GITHUB_ENV"
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          install: no
          key: macos-${{ matrix.expected-arch }}-appleclang-release-gui
          restore-keys: macos-${{ matrix.expected-arch }}-appleclang-release-gui
          max-size: 500M
          append-timestamp: true
          save: false
      - name: Configure, build, and smoke test
        run: |
          set -Eeuo pipefail
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DBUILD_TESTS=ON -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DWITH_ZMQ=ON -DWITH_MINIUPNPC=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  nightly-sanitizers:
    name: nightly sanitizers (ci:sanitizers)
    needs: classify
    if: needs.classify.outputs.nightly_sanitizers == 'true'
    uses: ./.github/workflows/nightly.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      suite: sanitizers

  nightly-fuzz:
    name: nightly platform fuzz (ci:fuzz)
    needs: classify
    if: needs.classify.outputs.nightly_fuzz == 'true'
    uses: ./.github/workflows/nightly.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      suite: fuzz

  nightly-platforms:
    name: nightly i686 Debug (ci:platforms)
    needs: classify
    if: needs.classify.outputs.nightly_platforms == 'true'
    uses: ./.github/workflows/nightly.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      suite: platforms

  nightly-full:
    name: full nightly assurance (ci:full)
    needs: classify
    if: needs.classify.outputs.nightly_full == 'true'
    uses: ./.github/workflows/nightly.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      suite: all

  required-result:
    name: required result
    if: always()
    needs: [classify, lint, gui, sanitizers, fuzz, compat, arm32, windows-smoke, macos-smoke, nightly-sanitizers, nightly-fuzz, nightly-platforms, nightly-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce selected required results
        env:
          CLASSIFY: ${{ needs.classify.result }}
          LINT: ${{ needs.lint.result }}
          GUI: ${{ needs.gui.result }}
          SANITIZERS: ${{ needs.sanitizers.result }}
          FUZZ: ${{ needs.fuzz.result }}
          COMPAT: ${{ needs.compat.result }}
          ARM32: ${{ needs.arm32.result }}
          WINDOWS: ${{ needs.windows-smoke.result }}
          MACOS: ${{ needs.macos-smoke.result }}
          NIGHTLY_SANITIZERS: ${{ needs.nightly-sanitizers.result }}
          NIGHTLY_FUZZ: ${{ needs.nightly-fuzz.result }}
          NIGHTLY_PLATFORMS: ${{ needs.nightly-platforms.result }}
          NIGHTLY_FULL: ${{ needs.nightly-full.result }}
          GUI_SELECTED: ${{ needs.classify.outputs.gui }}
          SANITIZERS_SELECTED: ${{ needs.classify.outputs.sanitizers }}
          FUZZ_SELECTED: ${{ needs.classify.outputs.fuzz }}
          COMPAT_SELECTED: ${{ needs.classify.outputs.compat == 'true' && needs.classify.outputs.nightly_full != 'true' }}
          PLATFORMS_SELECTED: ${{ needs.classify.outputs.platforms }}
          NIGHTLY_SANITIZERS_SELECTED: ${{ needs.classify.outputs.nightly_sanitizers }}
          NIGHTLY_FUZZ_SELECTED: ${{ needs.classify.outputs.nightly_fuzz }}
          NIGHTLY_PLATFORMS_SELECTED: ${{ needs.classify.outputs.nightly_platforms }}
          NIGHTLY_FULL_SELECTED: ${{ needs.classify.outputs.nightly_full }}
        run: |
          set -Eeuo pipefail
          check_selected() {
            local selected="$1" result="$2" name="$3"
            if [[ "${selected}" == true && "${result}" != success ]]; then
              echo "Selected required job ${name} finished as ${result}" >&2
              return 1
            fi
          }
          check_selected true "$CLASSIFY" classify
          check_selected true "$LINT" lint
          check_selected "$GUI_SELECTED" "$GUI" gui
          check_selected "$SANITIZERS_SELECTED" "$SANITIZERS" sanitizers
          check_selected "$FUZZ_SELECTED" "$FUZZ" fuzz
          check_selected "$COMPAT_SELECTED" "$COMPAT" compat
          check_selected "$PLATFORMS_SELECTED" "$ARM32" arm32
          check_selected "$PLATFORMS_SELECTED" "$WINDOWS" windows-smoke
          check_selected "$PLATFORMS_SELECTED" "$MACOS" macos-smoke
          check_selected "$NIGHTLY_SANITIZERS_SELECTED" "$NIGHTLY_SANITIZERS" nightly-sanitizers
          check_selected "$NIGHTLY_FUZZ_SELECTED" "$NIGHTLY_FUZZ" nightly-fuzz
          check_selected "$NIGHTLY_PLATFORMS_SELECTED" "$NIGHTLY_PLATFORMS" nightly-platforms
          check_selected "$NIGHTLY_FULL_SELECTED" "$NIGHTLY_FULL" nightly-full
