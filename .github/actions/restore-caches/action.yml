name: 'Restore Caches'
description: 'Restore depends sources, built depends, and previous-release caches'
runs:
  using: 'composite'
  steps:
    - name: Restore depends sources cache
      id: depends-sources
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.SOURCES_PATH }}
        key: depends-sources-${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
        restore-keys: |
          depends-sources-${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-

    - name: Restore built depends cache
      id: depends-built
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.BASE_CACHE }}
        key: depends-built-${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.DEPENDS_HASH }}
        restore-keys: |
          depends-built-${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-

    - name: Restore previous releases cache
      id: previous-releases
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.PREVIOUS_RELEASES_DIR }}
        key: previous-releases-${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-${{ env.PREVIOUS_RELEASES_HASH }}
        restore-keys: |
          previous-releases-${{ runner.os }}-${{ runner.arch }}-${{ env.CONTAINER_NAME }}-

    - name: export cache hits
      shell: bash
      run: |
        {
          echo "depends-sources-cache-hit=${{ steps.depends-sources.outputs.cache-hit }}"
          echo "depends-built-cache-hit=${{ steps.depends-built.outputs.cache-hit }}"
          echo "previous-releases-cache-hit=${{ steps.previous-releases.outputs.cache-hit }}"
        } >> "$GITHUB_ENV"
