name: Restore shared test inputs
description: Verify and use the inputs prepared by this workflow run
inputs:
  kind:
    default: unit_test_data
    description: unit_test_data or fuzz_corpora
  revision:
    required: true
    description: qa-assets revision prepared by this workflow run
runs:
  using: composite
  steps:
    - name: Restore prepared inputs
      uses: actions/download-artifact@v5
      with:
        name: qa-assets-${{ inputs.kind }}
        path: ${{ runner.temp }}/qa-assets
    - name: Verify prepared inputs
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        QA_ASSETS_REVISION: ${{ inputs.revision }}
        PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
      run: |
        set -Eeuo pipefail
        case "$KIND" in unit_test_data|fuzz_corpora) ;; *) exit 1 ;; esac
        [[ "$QA_ASSETS_REVISION" =~ ^[0-9a-f]{40}$ ]]
        staging="$(mktemp -d "$RUNNER_TEMP/qa-assets/.restore.XXXXXX")"
        trap 'rm -rf -- "$staging"' EXIT
        # A drive-qualified archive name makes GNU tar attempt remote transport.
        # Keep the archive argument relative, including on Windows D: runners.
        (cd "$staging" && tar -xf "../$KIND.tar")
        "$PYTHON" test/download_utils.py verify "$staging" "$KIND"
        rm -rf -- "$RUNNER_TEMP/qa-assets/$KIND"
        mv "$staging/$KIND" "$RUNNER_TEMP/qa-assets/$KIND"
        echo "QA_ASSETS_DIR=$RUNNER_TEMP/qa-assets" >> "$GITHUB_ENV"
        echo "QA_ASSETS_REVISION=$QA_ASSETS_REVISION" >> "$GITHUB_ENV"
